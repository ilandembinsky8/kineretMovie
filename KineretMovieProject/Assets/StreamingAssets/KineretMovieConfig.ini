; Kineret movie player config.
;
; MoviesPath = folder that holds the video folders.
;   Empty = StreamingAssets (default). A full path works too, e.g. MoviesPath=D:\KineretMovies
MoviesPath=C:\media\KineretMovieProject
;
; VideoFolder = which video folder inside MoviesPath to play.
;   That folder must hold the .mp4 files and a Movie.json that lists them in play order.
;   Options: Part 01 - finals | Part 01 - Eng - Final | part 02 finals | part 02-Eng-finals
VideoFolder=Part 01 - finals
